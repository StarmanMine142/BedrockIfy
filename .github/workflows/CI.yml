name: Build Bedrockify dev

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - name: Get Commit hash
        run: echo "SHORT_SHA=`echo ${GITHUB_SHA} | cut -c1-8`" >> $GITHUB_ENV

      - name: Change Mod Version
        uses: dschanoeh/change-property@646a5264f5854e0bc95d6e3bfb02562ddaaaa354 # v1.1.1
        with:
          file: gradle.properties
          property: mod_version
          value: "dev-${{env.SHORT_SHA}}"

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "temurin"
          java-version: 25

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build

      - name: Publish BedrockIfy
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: "BedrockIfy Dev ${{env.SHORT_SHA}}"
          path: ${{github.workspace}}/build/libs/*.jar
